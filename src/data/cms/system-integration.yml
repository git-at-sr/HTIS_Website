title: System Integration & IT Infrastructure - HTIS
hero:
  sectionId: system-integration-hero
  backgroundImage: src/assets/hero-bg.png
  title: System Integration & IT Infrastructure
  subtitle: We don't just deploy hardware; we architect the digital nervous
    systems of modern enterprises. Our System Integration vertical bridges the
    gap between high-performance physical infrastructure and cognitive digital
    operations.
  ctaLabel: Contact Us
  ctaUrl: "#contact"
  carouselImages:
    - src/assets/oip-2.webp
    - src/assets/web-analysis-programming-system-with-cloud-server-free-vector.jpg
    - src/assets/fff-1.jpg
strategicPillars:
  sectionId: strategic-pillars
  backgroundImage: src/assets/team-member-bg.png
  centerImage: src/assets/geminigeneratedimage8ndeq08ndeq08nde.png
  heading: Strategic Technical Pillars
  cards:
    - iconName: Server
      title: Converged Infrastructure & Data Centre Stack
      description: High-availability compute and storage architectures from the core
        to the edge.
      content: We deliver end-to-end infrastructure resilience through Hyperconverged
        Infrastructure (HCI), enterprise-grade server clusters, and scalable
        storage solutions, ensuring your Data Center stack remains future-ready
        and virtualization-optimized.
      column: left
    - iconName: Network
      title: Adaptive Networking & Secure Connectivity
      description: Intelligent LAN, WAN, and Campus fabrics designed for seamless,
        high-speed data flow.
      content: Our networking expertise covers the full spectrum of Active (Switches,
        Routers, IPABX) and Passive (OFC, Rack, Structured Cabling) components,
        integrated with SD-WAN and SDN technologies for software-defined
        agility.
      column: left
    - iconName: Cloud
      title: Hybrid Cloud & Digital Workspace
      description: Transitioning traditional environments into elastic, cloud-native
        modern workplaces.
      content: From complex Cloud Migrations (AWS/Azure) to Hybrid Cloud deployments
        and Virtual Desktop Infrastructure (VDI), we ensure your workforce stays
        connected and productive through secure, scalable cloud ecosystems.
      column: left
    - iconName: Briefcase
      title: Managed Lifecycle & ICT Projects
      description: Comprehensive service models ensuring long-term operational continuity.
      content: Our managed services provide strategic stability through specialized
        Manpower (L1-L6), customized AMC/CAMC models, and end-to-end ICT project
        management tailored for large-scale government and private sector
        rollouts.
      column: center
    - iconName: ShieldCheck
      title: Unified Cyber-Defence & Resilience
      description: Perimeter-to-Endpoint security frameworks to mitigate modern threat
        landscapes.
      content: We deploy robust security architectures including Next-Gen Firewalls,
        Identity & Access Management (IAM), and advanced EDR/XDR/Email Security
        solutions to ensure 360-degree data protection and regulatory
        compliance.
      column: right
    - iconName: Cctv
      title: Environmental Control & Physical Security
      description: Critical infrastructure protection including surveillance, power,
        and thermal management.
      content: We secure the physical layer through integrated Surveillance (CCTV) and
        Access Control, supported by mission-critical power backups (UPS), fire
        suppression systems, and specialized refrigeration for high-density IT
        environments.
      column: right
    - iconName: Monitor
      title: Professional Compute & Visual Systems
      description: Specialized hardware and immersive AV/VC solutions for the modern
        enterprise.
      content: We provide a full suite of high-performance compute, including
        workstations, notebooks, and peripherals, alongside advanced AV/VC
        integrations like LED Walls and professional projection systems for
        high-impact communication.
      column: right
