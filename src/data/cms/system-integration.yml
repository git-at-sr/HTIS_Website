  heading: |-
    Built to Execute.
    Scaled to Deliver.
  metrics:
    - target: 1.2
      showDecimalAnimation: true
      unit: M
      suffix: +
      label: Sites Deployed
    - target: 250
      showDecimalAnimation: false
      unit: K
      suffix: +
      label: Routers Deployed
    - target: 16
      showDecimalAnimation: false
      suffix: +
      label: Telecom Circles (India)
    - target: 8
      showDecimalAnimation: false
      suffix: +
      label: Countries Served
      subLabel: India, Bangladesh, Nepal, Sri Lanka, South Africa, UK, Nigeria, CAR
    - target: 3
      showDecimalAnimation: false
      suffix: /4
      label: Major Indian Operators Served
  pillars:
    - iconName: Network
      title: |-
        Core Telecom
        and Network Operations
      description: Scaling the Experts of Next-Gen Connectivity. Mobilizing
        mission-critical field and core engineering teams for 4G/5G rollouts and
        network evolution. We provide the specialized riggers, CCNA/ACI
        engineers, and operations coordinators required to ensure carrier-grade
        stability and high-performance network execution.
      url: "#"
    - iconName: Users
      title: |-
        Specialized Technical Resourcing
        and Deployment
      description: Scalable L1-L6 talent solutions engineered for complex,
        multi-region telecom rollouts. We bridge the technical skill gap by
        deploying a domain-expert workforce. From high-niche technical
        architects (L6) to scalable field engineering units (L1), we provide the
        human capital required for operational excellence.
      url: "#"
    - iconName: Code
      title: |-
        Enterprise Software Engineering
        and On-Demand Solutions
      description: Bespoke digital assets and SaaS platforms tailored for government
        and corporate scale. We build the intelligence that drives connectivity.
        Specializing in on-demand software development, we deliver secure,
        high-compliance digital assets-including our proprietary ERP
        systems-designed for the most demanding regulatory environments.
      url: "#"
