        - title: Lifecycle Management
          desc: End-to-end tracking of equipment from deployment to decommission.
        - title: SLA-Driven Service Delivery
          desc: Guaranteed response and resolution times for mission-critical services.
processes:
  sectionId: telecom-processes
  heading: |-
    Telecom Processes -
    Blueprint to Reality.
  items:
    - title: Strategic Planning & Site Acquisition (SAQ)
      description: The foundational phase where the network's physical and regulatory
        footprint is defined.
      image: src/assets/strategic-planning-and-site-acquisition-saq.png
      details:
        - name: RF Nominal Planning
          desc: Defining coverage targets and capacity requirements for 4G/5G rollout.
        - name: Technical Feasibility & TSSR
          desc: Conducting Technical Site Survey Reports to evaluate structural and power
            readiness.
        - name: Regulatory & Compliance
          desc: Managing SACFA clearances, spectrum coordination, and local authority
            permissions.
        - name: Site Acquisition
          desc: Negotiating and securing land, rooftops, or tower space for the Points of
            Presence (PoP).
    - title: Network Architecture & Detailed Engineering (HLD/LLD)
      description: Translating the blueprint into granular, executable technical designs.
      image: src/assets/geminigeneratedimagelblfyflblfyflblf.png
      details:
        - name: High-Level Design (HLD)
          desc: Defining end-to-end topology, including core integration and backhaul
            strategy.
        - name: Low-Level Design (LLD)
          desc: Detailed port mapping, IP addressing schemes, and rack layouts for the
            Data Center.
        - name: Link Budgeting
          desc: Calculation of signal gains and losses to ensure seamless transmission
            quality.
        - name: Fiber Route Engineering
          desc: Designing the path for high-capacity backhaul through trenching or aerial
            fiber.
    - title: Technical Procurement & BoQ Management (BOQ)
      description: Ensuring the right multi-vendor hardware is sourced according to
        engineering specs.
      image: src/assets/geminigeneratedimage7dnd1x7dnd1x7dnd.png
      details:
        - name: BoQ (Bill of Quantities) Finalization
          desc: Detailed listing of every active and passive component needed.
        - name: Vendor Ecosystem Integration
          desc: Coordinating with OEMs like Ericsson, Nokia, or Cisco for specialized
            hardware.
        - name: Logistics & Spares Management
          desc: Ensuring "Just-in-Time" delivery of critical components to remote sites.
    - title: Passive & Active Installation & Commissioning (I&C)
      description: The ground-level execution where the physical network is built.
      image: src/assets/geminigeneratedimagepjf5ckpjf5ckpjf5.png
      details:
        - name: Civil & Structural Works
          desc: Execution of tower foundations, earthing systems, and Data Center civil
            fit-outs.
        - name: Active Equipment I&C
          desc: Mounting antennas, installing RRUs (Remote Radio Units), and configuring
            Core routers.
        - name: Power & Utility Setup
          desc: Integration of Rectifiers, Battery Banks, and Green Energy (Solar/DG)
            solutions.
    - title: Network Integration & Core Connectivity
      description: Connecting the physical site to the global telecom heartbeat.
      image: src/assets/geminigeneratedimage7goezc7goezc7goe.png
      details:
        - name: Core Network Integration
          desc: Mapping the local site into the operator's PCRF, EPC, or 5G Core.
        - name: Call Flow Testing
          desc: Verifying end-to-end voice and data paths (VoLTE/VoNR) through the newly
            deployed nodes.
        - name: Cross-Connect Management
          desc: Establishing high-speed fiber interconnects between the DC and the Telco
            backbone.
    - title: Quality Assurance & Acceptance Testing (ATP)
      description: Rigorous benchmarking to ensure the network meets Tier-1
        performance standards.
      image: src/assets/geminigeneratedimagemy5ptumy5ptumy5p.png
      details:
        - name: ATP (Acceptance Test Procedure)
          desc: Executing client-approved test cases to ensure the site is ready for
            traffic.
        - name: KPI Benchmarking
          desc: Measuring Latency, Throughput, and Handover success rates against target
            thresholds.
        - name: Regulatory Compliance Audit
          desc: Final verification of EMF (Electromagnetic Field) radiation and safety
            standards.
    - title: Lifecycle Managed Services & NOC Operations
      description: Shifting from deployment to 24/7 proactive stability and optimization.
      image: src/assets/geminigeneratedimage52u2sx52u2sx52u2.png
      details:
        - name: NOC Operations
          desc: Real-time monitoring of network health through a centralized Network
            Operations Centre.
        - name: Preventive & Corrective Maintenance
          desc: Managing MTTR (Mean Time to Repair) through skilled field technical teams.
        - name: Ongoing Optimization
          desc: Continuous tuning of RF parameters and software patches to maintain peak
            performance.
