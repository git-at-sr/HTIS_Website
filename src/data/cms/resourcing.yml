standard:
  sectionId: htis-standard
  heading: 'Engineered Human Capital: The HTIS Standard'
  description: A performance-driven framework for rapid deployment and operational excellence.
  items:
    - iconName: Users
      title: The Agile Resource Scaling
      desc: High-Velocity Deployment at Scale We specialize in rapid-deployment cycles for large-scale network rollouts, delivering high-volume technical teams to the field within compressed timelines to meet critical expansion milestones.
    - iconName: Wrench
      title: Precision Technical Vetting
      desc: 98% Trial-to-Hire Success Rate Our rigorous job-description validation process ensures a near-perfect technical match by subjecting every L1-L6 specialist to exhaustive technical benchmarking and background verification before site deployment.
    - iconName: Maximize
      title: Zero-Risk Statutory Compliance
      desc: 100% Adherence to Global Standards We eliminate financial and safety risks for our clients by providing absolute adherence to PF, ESIC, and statutory labor mandates alongside comprehensive insurance coverage.
    - iconName: UserCheck
      title: Sustained Operational Reliability
      desc: Commitment to Ongoing Infrastructure Health Focused on long-term infrastructure stability, our workforce model prioritizes operational continuity through a strategic shift toward ongoing support rather than short-term project deployments.
  images:
    - image: src/assets/lob-resourcing-construction-1.png
      alt: Team Working
    - image: src/assets/lob-resourcing-construction-2.png
      alt: Team Planning
    - image: src/assets/lob-resourcing-construction-3.png
      alt: Team Discussion
