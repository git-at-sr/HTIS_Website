services:
  sectionId: services
  headingHtml: Our<br/>Services
  backgroundImage: src/assets/our-services-bg.png
  items:
    - id: telecom
      titleHtml: Tele&shy;communica&shy;tions
      href: /telecom
      features:
        - iconName: Wifi
          label: 5G Core & IMS
          description: Service-Based Architecture (SBA) and VoLTE/VoNR cloud-native
            deployment.
        - iconName: ShieldCheck
          label: Packet Core Ops
          description: Management of EPC, PCRF, and GI-LAN for high-throughput user-plane
            traffic.
        - iconName: Cable
          label: IP/MPLS Transport
          description: Advanced routing, segment routing (SRv6), and high-capacity
            backhaul engineering.
        - iconName: Radio
          label: RF & Wireless Design
          description: Precision radio frequency planning, 4G/5G site surveys, and
            coverage optimization.
        - iconName: Headset
          label: Compliance & IPDR
          description: Automated IP Detail Record generation and regulatory data retention
            systems.
        - iconName: Wrench
          label: Managed Maintenance
          description: 24/7 proactive NOC support and comprehensive AMC for multi-vendor
            hardware.
      metrics:
        - value: 100+
          label: Network<br/>Deployment
        - value: 11+
          label: Years of<br/>Experience
        - value: 99%
          label: Guaranteed<br/>Network<br/>Uptime
        - value: 500+
          label: Critical Network<br/>Nodes Managed
    - id: resourcing
      titleHtml: Resourcing
      href: /resourcing
      features:
        - iconName: Users
          label: L1-L6 Talent Hub
          description: Full-spectrum resourcing from field technicians to senior system
            architects.
        - iconName: Clock
          label: Niche Engineering
          description: Sourcing specialized experts for Packet Core, Cybersecurity, and
            Cloud migration.
        - iconName: UserSearch
          label: Project-Task Units
          description: Ready-to-deploy technical teams for task-based execution and site
            rollouts.
        - iconName: FileSignature
          label: Executive Search
          description: Targeted leadership hiring for high-stakes digital transformation
            projects.
        - iconName: CircleDollarSign
          label: Staff Augmentation
          description: Flexible, scalable technical manpower to bridge immediate skill gaps.
        - iconName: Network
          label: Managed Compliance
          description: End-to-end payroll, insurance, and regulatory management for
