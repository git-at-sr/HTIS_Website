media:
  input: src/assets
  output: src/assets
  extensions: [png, jpg, jpeg, webp, svg]
  rename: safe

content:
  - name: settings
    label: Settings
    type: group
    items:
      - name: site
        label: Site
        type: file
        path: src/data/cms/site.yml
        format: yaml
        operations:
          delete: false
        fields:
          - name: defaultTitle
            label: Default title
            type: string
            required: true
          - name: language
            type: string
            required: true
          - name: defaultTheme
            label: Default theme
            type: select
            required: true
            options:
              values: [light, dark, system default]
          - name: favicon
            label: Favicon image
            type: image
            required: true
          - name: seo
            label: SEO defaults
            type: object
            fields:
              - name: description
                label: Meta description
                type: text
                required: true
              - name: siteUrl
                label: Site URL
                type: string
                required: true
              - name: siteName
                label: Site name
                type: string
                required: true
              - name: ogImage
                label: Open Graph image
                type: image
                required: true
              - name: robots
                label: Robots directive
                type: string
                required: true
          - name: globalToast
            label: Global site toast
            type: object
            fields:
              - name: enabled
                label: Show toast
                type: boolean
                required: true
              - name: message
                label: Message
                type: text
                required: true

      - name: navigation
        label: Navigation
        type: file
        path: src/data/cms/navigation.yml
        format: yaml
        operations:
          delete: false
        fields:
          - name: logo
            type: object
            fields:
              - name: image
                type: image
                required: true
              - name: alt
                type: string
                required: true
          - name: primary
            type: object
            fields:
              - name: home
                type: object
                fields: &nav_link_fields
                  - name: title
                    type: string
                    required: true
                  - name: url
                    type: string
                    required: true
              - name: career
                type: object
                fields: *nav_link_fields
              - name: contact
                type: object
                fields: *nav_link_fields
          - name: solutions
            type: object
            fields: &nav_group_fields
              - name: label
                type: string
                required: true
              - name: heading
                type: string
                required: true
              - name: card
                type: object
                fields:
                  - name: image
                    type: image
                    required: true
                  - name: alt
                    type: string
                    required: true
                  - name: title
                    type: string
                    required: true
                  - name: description
                    type: text
                    required: true
                  - name: ctaLabel
                    label: CTA label
                    type: string
                    required: true
                  - name: ctaUrl
                    label: CTA URL
                    type: string
                    required: true
              - name: items
                type: object
                list:
                  collapsible:
                    collapsed: true
                    summary: '{title}'
                fields: &nav_item_fields
                  - name: title
                    type: string
                    required: true
                  - name: desc
                    label: Description
                    type: text
                    required: true
                  - name: url
                    type: string
                    required: true
                  - name: icon
                    type: select
                    required: false
                    options:
                      values:
                        &icon_name_values [
                          None,
                          Activity,
                          AlertTriangle,
                          ArrowRight,
                          Award,
                          Banknote,
                          Blocks,
                          BookOpen,
                          Briefcase,
                          Building,
                          Building2,
                          Cable,
                          Cctv,
                          CheckCircle2,
                          CheckSquare,
                          CircleDollarSign,
                          Clock,
                          Cloud,
                          Code,
                          ClipboardList,
                          Cpu,
                          Database,
                          Factory,
                          FileCheck,
                          FileCode,
                          FileSignature,
                          Fingerprint,
                          HardDrive,
                          HardHat,
                          Headset,
                          HeartPulse,
                          Info,
                          Landmark,
                          Laptop,
                          Layout,
                          Lock,
                          MapPin,
                          Maximize,
                          Monitor,
                          MonitorSmartphone,
                          Network,
                          Phone,
                          Plug,
                          Radio,
                          RadioTower,
                          RefreshCw,
                          Route,
                          Scale,
                          Server,
                          Shield,
                          ShieldCheck,
                          Signal,
                          Smartphone,
                          TrendingUp,
                          UserCheck,
                          UserPlus,
                          UserSearch,
                          Users,
                          Wifi,
                          Wrench,
                          Zap,
                        ]
          - name: industries
            type: object
            fields:
              - name: label
                type: string
                required: true
              - name: heading
                type: string
                required: true
              - name: viewAll
                label: View all item
                type: object
                fields: *nav_item_fields
          - name: resources
            type: object
            fields: *nav_group_fields

      - name: contactForm
        label: Contact form
        type: file
        path: src/data/cms/contact-form.yml
        format: yaml
        operations:
          delete: false
        fields:
          - name: heading
            label: Heading
            type: string
            required: true
          - name: postUrl
            label: POST API call URL
            type: string
            required: true
          - name: categoryDdlUrl
            label: Category dropdown API URL
            type: string
            required: true

      - name: footer
        label: Footer
        type: file
        path: src/data/cms/footer.yml
        format: yaml
        operations:
          delete: false
        fields:
          - name: logo
            type: object
            fields:
              - name: image
                type: image
                required: true
              - name: alt
                type: string
                required: true
          - name: description
            type: text
            required: true
          - name: company
            type: object
            fields: &footer_section_fields
              - name: heading
                type: string
                required: true
              - name: links
                type: object
                list:
                  collapsible:
                    collapsed: true
                    summary: '{label}'
                fields: &footer_link_fields
                  - name: label
                    type: string
                    required: true
                  - name: url
                    type: string
                    required: true
          - name: services
            type: object
            fields: *footer_section_fields
          - name: socials
            type: object
            fields:
              - name: links
                type: object
                list:
                  collapsible:
                    collapsed: true
                    summary: '{label}'
                fields:
                  - name: label
                    type: string
                    required: true
                  - name: url
                    type: string
                    required: true
                  - name: icon
                    type: select
                    required: true
                    options:
                      values: [Facebook, Instagram, Youtube, Twitter, LinkedIn]
          - name: contact
            type: object
            fields:
              - name: heading
                type: string
                required: true
              - name: phone
                type: string
                required: true
              - name: email
                type: string
                required: true
          - name: offices
            label: Offices
            type: object
            fields:
              - name: heading
                type: string
                required: true
              - name: indiaFlagCode
                label: India flag code
                type: string
                required: true
              - name: list
                label: Office list
                type: object
                list:
                  collapsible:
                    collapsed: true
                    summary: '{name}'
                fields:
                  - name: name
                    type: string
                    required: true
                  - name: companyName
                    label: Company name
                    type: string
                    required: true
                  - name: address
                    type: text
                    required: true
                  - name: phone
                    type: string
                    required: true
                  - name: email
                    type: string
                    required: true
          - name: globalPresence
            label: Global presence
            type: object
            fields:
              - name: heading
                type: string
                required: true
              - name: ctaLabel
                label: CTA label
                type: string
                required: true
              - name: ctaUrl
                label: CTA URL
                type: string
                required: true
              - name: countries
                type: object
                list:
                  collapsible:
                    collapsed: true
                    summary: '{name}'
                fields:
                  - name: name
                    type: string
                    required: true
                  - name: code
                    type: string
                    required: true
          - name: copyright
            type: string
            required: true
          - name: legalLinks
            label: Legal links
            type: object
            list:
              collapsible:
                collapsed: true
                summary: '{label}'
            fields: *footer_link_fields

  - name: pages
    label: Pages
    type: group
    items:
      - name: home
        label: Home
        type: file
        path: src/data/cms/home.yml
        format: yaml
        operations:
          delete: false
        fields:
          - name: hero
            type: object
            fields:
              - name: sectionId
                label: Section ID
                type: string
                required: false
              - name: backgroundImage
                label: Background image
                type: image
                required: true
              - name: titlePrefix
                label: Title prefix
                type: string
                required: true
              - name: rotatingWords
                label: Rotating words
                type: string
                list: true
                required: true
              - name: subtitle
                type: text
                required: true
              - name: ctaLabel
                label: CTA label
                type: string
                required: true
              - name: ctaUrl
                label: CTA URL
                type: string
                required: true
              - name: trustedByLabel
                label: Trusted by label
                type: string
                required: true
              - name: partnerLogos
                label: Partner logos
                type: object
                list:
                  collapsible:
                    collapsed: true
                    summary: '{alt}'
                fields:
                  - name: image
                    type: image
                    required: true
                  - name: alt
                    type: string
                    required: true
          - name: services
            type: object
            fields:
              - name: sectionId
                label: Section ID
                type: string
                required: false
              - name: headingHtml
                label: Heading HTML
                type: string
                required: true
              - name: backgroundImage
                label: Background image
                type: image
                required: true
              - name: items
                label: Services
                type: object
                list:
                  collapsible:
                    collapsed: true
                    summary: '{id}'
                fields:
                  - name: id
                    type: select
                    required: true
                    options:
                      values: [telecom, resourcing, software, system]
                  - name: titleHtml
                    label: Title HTML
                    type: string
                    required: true
                  - name: href
                    label: Link URL
                    type: string
                    required: true
                  - name: features
                    type: object
                    list:
                      collapsible:
                        collapsed: true
                        summary: '{label}'
                    fields:
                      - name: iconName
                        label: Icon (theme-colored SVG)
                        type: select
                        required: false
                        options:
                          values: *icon_name_values
                      - name: label
                        type: string
                        required: true
                      - name: description
                        type: text
                        required: true
                  - name: metrics
                    type: object
                    list:
                      collapsible:
                        collapsed: true
                        summary: '{value} - {label}'
                    fields:
                      - name: value
                        type: string
                        required: true
                      - name: label
                        type: string
                        required: true
          - name: journey
            type: object
            fields:
              - name: sectionId
                label: Section ID
                type: string
                required: false
              - name: title
                label: Title
                type: string
                required: true
              - name: subtitle
                type: text
                required: true
              - name: milestones
                type: object
                list:
                  collapsible:
                    collapsed: true
                    summary: '{year} - {title}'
                fields: &milestone_fields
                  - name: year
                    type: string
                    required: true
                  - name: title
                    type: string
                    required: true
                  - name: description
                    type: text
                    required: true
                  - name: image
                    type: image
                    required: true
          - name: team
            type: object
            fields:
              - name: sectionId
                label: Section ID
                type: string
                required: false
              - name: backgroundImage
                type: image
                required: true
              - name: meetTeamImage
                type: image
                required: true
              - name: heading
                type: string
                required: true
              - name: description
                type: text
                required: true
              - name: ctaTitle
                type: string
                required: true
              - name: ctaLabel
                type: string
                required: true
              - name: ctaUrl
                type: string
                required: true
              - name: members
                type: object
                list:
                  collapsible:
                    collapsed: true
                    summary: '{name}'
                fields:
                  - name: name
                    type: string
                    required: true
                  - name: role
                    type: string
                    required: true
                  - name: desc
                    type: text
                    required: true
                  - name: image
                    type: image
                    required: true
          - name: footprint
            type: object
            fields:
              - name: sectionId
                label: Section ID
                type: string
                required: false
              - name: heading
                type: string
                required: true
              - name: metrics
                type: object
                list:
                  collapsible:
                    collapsed: true
                    summary: '{value}{suffix} - {label}'
                fields:
                  - name: value
                    type: string
                    required: true
                  - name: suffix
                    type: string
                    required: false
                  - name: label
                    type: string
                    required: true
              - name: globe
                type: object
                fields:
                  - name: markers
                    label: Globe markers
                    type: object
                    list:
                      collapsible:
                        collapsed: true
                        summary: '{name}'
                    fields:
                      - name: name
                        type: string
                        required: true
                      - name: latitude
                        type: number
                        required: true
                      - name: longitude
                        type: number
                        required: true
                      - name: size
                        label: Marker size
                        type: number
                        required: true
          - name: clients
            type: object
            fields:
              - name: sectionId
                label: Section ID
                type: string
                required: false
              - name: heading
                type: string
                required: true
              - name: ctaUrl
                label: CTA URL
                type: string
                required: true
              - name: ctaLabel
                label: CTA label
                type: string
                required: true
              - name: logos
                label: Client logos
                type: object
                list:
                  collapsible:
                    collapsed: true
                    summary: '{alt}'
                fields:
                  - name: image
                    type: image
                    required: true
                  - name: alt
                    type: string
                    required: true
          - name: testimonials
            type: object
            fields:
              - name: sectionId
                label: Section ID
                type: string
                required: false
              - name: heading
                label: Heading
                type: string
                required: true
              - name: ctaUrl
                label: CTA URL
                type: string
                required: true
              - name: ctaLabel
                label: CTA label
                type: string
                required: true
              - name: awardsImage
                label: Awards image
                type: image
                required: true
              - name: awardsImageAlt
                label: Awards image alt
                type: string
                required: true
              - name: items
                label: Testimonials
                type: object
                list:
                  collapsible:
                    collapsed: true
                    summary: '{name} - {title}'
                fields:
                  - name: quote
                    type: text
                    required: true
                  - name: name
                    type: string
                    required: true
                  - name: title
                    type: string
                    required: true
          - name: articles
            type: object
            fields:
              - name: enabled
                label: Enable section
                type: boolean
                default: true
                required: true
              - name: sectionId
                label: Section ID
                type: string
                required: false
              - name: eyebrow
                type: string
                required: true
              - name: heading
                type: string
                required: true
              - name: ctaLabel
                label: CTA label
                type: string
                required: true
              - name: ctaUrl
                label: CTA URL
                type: string
                required: true
              - name: posts
                label: LinkedIn posts
                type: object
                list:
                  collapsible:
                    collapsed: true
                    summary: '{fallbackTitle}'
                fields:
                  - name: embedCode
                    label: LinkedIn iframe embed code
                    type: text
                    required: true
                  - name: fallbackTitle
                    label: Fallback title
                    type: text
                    required: false

      - name: about
        label: About
        type: file
        path: src/data/cms/about.yml
        format: yaml
        operations:
          delete: false
        fields:
          - name: title
            type: string
            required: true
          - name: hero
            type: object
            fields:
              - name: sectionId
                label: Section ID
                type: string
                required: false
              - name: backgroundImage
                label: Background image
                type: image
                required: true
              - name: title
                type: string
                required: true
              - name: subtitle
                type: text
                required: true
              - name: ctaLabel
                label: CTA label
                type: string
                required: true
              - name: ctaUrl
                label: CTA URL
                type: string
                required: true
          - name: mission
            label: Mission section
            type: object
            fields:
              - name: sectionId
                label: Section ID
                type: string
                required: false
              - name: image
                type: image
                required: true
              - name: imageAlt
                label: Image alt
                type: string
                required: true
              - name: cards
                type: object
                list:
                  collapsible:
                    collapsed: true
                    summary: '{title}'
                fields:
                  - name: title
                    type: string
                    required: true
                  - name: description
                    type: text
                    required: true
          - name: lifeAtHtis
            label: Life at HTIS
            type: object
            fields:
              - name: sectionId
                label: Section ID
                type: string
                required: false
              - name: backgroundImage
                label: Background image
                type: image
                required: true
              - name: image
                type: image
                required: true
              - name: imageAlt
                label: Image alt
                type: string
                required: true
              - name: title
                type: string
                required: true
              - name: body
                type: text
                list: true
                required: true
              - name: ctaLabel
                label: CTA label
                type: string
                required: true
              - name: ctaUrl
                label: CTA URL
                type: string
                required: true
          - name: team
            type: object
            fields:
              - name: sectionId
                label: Section ID
                type: string
                required: false
              - name: title
                type: string
                required: true
              - name: description
                type: text
                required: true
              - name: members
                type: object
                list:
                  collapsible:
                    collapsed: true
                    summary: '{name}'
                fields:
                  - name: name
                    type: string
                    required: true
                  - name: role
                    type: string
                    required: true
                  - name: dept
                    label: Department
                    type: string
                    required: true
                  - name: image
                    type: image
                    required: true
          - name: ourPresence
            label: Our Presence
            type: object
            fields:
              - name: sectionId
                label: Section ID
                type: string
                required: false
              - name: title
                type: string
                required: true
              - name: description
                type: text
                required: true
              - name: globalTabLabel
                label: Global tab label
                type: string
                required: true
              - name: indiaTabLabel
                label: India tab label
                type: string
                required: true
              - name: globalLocations
                label: Global locations
                type: object
                list:
                  collapsible:
                    collapsed: true
                    summary: '{name}'
                fields:
                  - name: name
                    type: string
                    required: true
                  - name: address
                    type: text
                    required: true
                  - name: phone
                    type: string
                    required: false
                  - name: email
                    type: string
                    required: false
                  - name: lat
                    label: Latitude
                    type: number
                    required: true
                  - name: lng
                    label: Longitude
                    type: number
                    required: true
                  - name: isHQ
                    label: Headquarters
                    type: boolean
                    required: false
                  - name: mapUrl
                    label: Google Maps link
                    type: string
                    required: false
              - name: indiaOffices
                label: India offices
                type: object
                list:
                  collapsible:
                    collapsed: true
                    summary: '{name}'
                fields:
                  - name: name
                    type: string
                    required: true
                  - name: address
                    type: text
                    required: true
                  - name: phone
                    type: string
                    required: false
                  - name: email
                    type: string
                    required: false
                  - name: lat
                    label: Latitude
                    type: number
                    required: true
                  - name: lng
                    label: Longitude
                    type: number
                    required: true
                  - name: isHQ
                    label: Headquarters
                    type: boolean
                    required: false
                  - name: mapUrl
                    label: Google Maps link
                    type: string
                    required: false
          - name: principles
            type: object
            fields:
              - name: sectionId
                label: Section ID
                type: string
                required: false
              - name: image
                type: image
                required: true
              - name: imageAlt
                label: Image alt
                type: string
                required: true
              - name: title
                type: string
                required: true
              - name: description
                type: text
                required: true
              - name: items
                type: string
                list: true
                required: true
          - name: social
            label: Latest from our Social
            type: object
            fields:
              - name: enabled
                label: Enable section
                type: boolean
                default: true
                required: true
              - name: sectionId
                label: Section ID
                type: string
                required: false
              - name: eyebrow
                type: string
                required: true
              - name: heading
                type: string
                required: true
              - name: posts
                label: Facebook, Instagram, and LinkedIn posts
                type: object
                list:
                  collapsible:
                    collapsed: true
                    summary: '{platform}: {fallbackTitle}'
                fields:
                  - name: platform
                    type: select
                    options:
                      values:
                        - facebook
                        - instagram
                        - linkedin
                    required: true
                  - name: embedCode
                    label: Social post embed code
                    description: Paste the official Facebook, Instagram, or LinkedIn embed code.
                    type: text
                    required: true
                  - name: fallbackTitle
                    label: Fallback title
                    type: text
                    required: false

      - name: awards
        label: Awards
        type: file
        path: src/data/cms/awards.yml
        format: yaml
        operations:
          delete: false
        fields:
          - name: title
            type: string
            required: true
          - name: hero
            type: object
            fields:
              - name: sectionId
                label: Section ID
                type: string
                required: false
              - name: backgroundImage
                label: Background image
                type: image
                required: true
              - name: title
                type: string
                required: true
              - name: subtitle
                type: text
                required: true
          - name: gallery
            label: Gallery section
            type: object
            fields:
              - name: sectionId
                label: Section ID
                type: string
                required: true
              - name: items
                type: object
                list:
                  collapsible:
                    collapsed: true
                    summary: '{title}'
                fields:
                  - name: type
                    type: select
                    required: true
                    options:
                      values: [award, certificate]
                  - name: title
                    type: string
                    required: true
                  - name: slug
                    label: Slug (Must be unique)
                    type: string
                    required: false
                  - name: organization
                    type: string
                    required: true
                  - name: date
                    type: string
                    required: true
                  - name: thumbnail
                    label: Display thumbnail
                    type: image
                    required: true
                  - name: images
                    label: Popup carousel photos
                    type: object
                    list:
                      collapsible:
                        collapsed: true
                        summary: '{alt}'
                    fields:
                      - name: image
                        type: image
                        required: true
                      - name: alt
                        label: Image alt
                        type: string
                        required: true

      - name: telecom
        label: Telecom
        type: file
        path: src/data/cms/telecom.yml
        format: yaml
        operations:
          delete: false
        fields:
          - name: title
            type: string
            required: true
          - name: hero
            type: object
            fields:
              - name: sectionId
                label: Section ID
                type: string
                required: false
              - name: backgroundImage
                label: Background image
                type: image
                required: true
              - name: foregroundImage
                label: Foreground image
                type: image
                required: false
              - name: title
                type: text
                required: true
              - name: subtitle
                type: text
                required: true
              - name: ctaLabel
                label: CTA label
                type: string
                required: true
              - name: ctaUrl
                label: CTA URL
                type: string
                required: true
          - name: capabilities
            type: object
            fields:
              - name: sectionId
                label: Section ID
                type: string
                required: false
              - name: backgroundImage
                label: Background image
                type: image
                required: true
              - name: heading
                type: string
                required: true
              - name: description
